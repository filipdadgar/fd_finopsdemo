services:

  # Step 1: Generate the 90-day OpenMetrics seed file
  finops-seeder:
    build:
      context: ./backend
      dockerfile: FinOpsDemoApp/Dockerfile
    container_name: finops-seeder
    environment:
      APP_MODE: seed
      DEMO_RANDOM_SEED: "42"
    volumes:
      - seed-data:/tmp/demo-seed
    restart: "no"

  # Step 2: Convert OpenMetrics file to Prometheus TSDB blocks
  prometheus-seeder:
    image: prom/prometheus:v2.51.0
    container_name: prometheus-seeder
    depends_on:
      finops-seeder:
        condition: service_completed_successfully
    volumes:
      - seed-data:/tmp/demo-seed
      - prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        promtool tsdb create-blocks-from openmetrics \
          /tmp/demo-seed/demo-metrics.openmetrics \
          /prometheus && \
        echo "TSDB blocks created successfully"
    restart: "no"

  # Step 3: Prometheus with pre-seeded history
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    depends_on:
      prometheus-seeder:
        condition: service_completed_successfully
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=120d
      - --storage.tsdb.allow-overlapping-blocks
      - --query.lookback-delta=25h
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Step 4: OpenTelemetry Collector (OTLP → Prometheus)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "8889:8889"   # Prometheus scrape endpoint
    # distroless image has no shell/curl — health check disabled; exporter retries OTLP connection
    restart: unless-stopped

  # Step 5: C# live exporter (emits OTLP to collector every 15s)
  finops-exporter:
    build:
      context: ./backend
      dockerfile: FinOpsDemoApp/Dockerfile
    container_name: finops-exporter
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      APP_MODE: exporter
      DEMO_RANDOM_SEED: "42"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Step 6: Grafana with auto-provisioned dashboards
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: demo
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  seed-data:
  prometheus-data:
  grafana-data:

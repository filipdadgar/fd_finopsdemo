apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: finops-demo
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: prom-scrape
      port: 8889
      targetPort: 8889
    - name: health
      port: 13133
      targetPort: 13133